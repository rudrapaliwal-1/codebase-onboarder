<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codebase Onboarder</title>
  <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
  <h1>Codebase Onboarder</h1>
  <input type="text" id="repoUrl" placeholder="Paste a GitHub repo URL" style="width: 400px; padding: 8px;">
  <button id="analyzeBtn">Analyze</button>
<div id="app"></div>

  <script>
  document.getElementById("analyzeBtn").addEventListener("click", () => {
  const url = document.getElementById("repoUrl").value;

  document.getElementById("app").innerHTML = `
    <div class="orbit-loader">
      <div class="orbit-container">
        <div class="orbit-center"></div>
        <div class="orbit orbit-1"><div class="particle"></div></div>
        <div class="orbit orbit-2"><div class="particle"></div></div>
        <div class="orbit orbit-3"><div class="particle"></div></div>
      </div>
      <p class="orbit-text" id="orbitText">Fetching repository...</p>
    </div>
  `;

  const orbitMessages = ["Fetching repository...", "Reading key files...", "Analyzing with AI...", "Almost done..."];
  let orbitIndex = 0;
  const orbitInterval = setInterval(() => {
    orbitIndex = (orbitIndex + 1) % orbitMessages.length;
    const el = document.getElementById("orbitText");
    if (el) el.textContent = orbitMessages[orbitIndex];
  }, 1800);

  fetch(`https://codebase-onboarder-pvbj.onrender.com/analyze?repo_url=${encodeURIComponent(url)}`)
    .then(res => res.json())
    .then(data => {
       clearInterval(orbitInterval);
       document.getElementById("app").innerHTML = "";
       if (data.error) {
         document.getElementById("app").innerHTML = `<p style="color:red">${data.error}</p>`;
         return;
       }
       renderSummary(data);
       renderTechStack(data);
       renderReadingOrder(data);
       renderSetup(data);
    });
});

  function renderSummary(data) {
    const app = document.getElementById("app");
    app.innerHTML += `
      <div class="card">
        <h2>Summary</h2>
        <p>${data.summary}</p>
      </div>
    `;
  }
  function renderTechStack(data) {
    const app = document.getElementById("app");
    let rows = "";
    data.tech_stack.forEach(item => {
      rows += `
        <tr>
          <td>${item.layer}</td>
          <td>${item.technology}</td>
          <td>${item.notes}</td>
        </tr>
      `;
    });

    app.innerHTML += `
      <div class="card">
        <h2>Tech Stack</h2>
        <table>
          <tr><th>Layer</th><th>Technology</th><th>Notes</th></tr>
          ${rows}
        </table>
      </div>
    `;
  }

  function renderReadingOrder(data) {
  const app = document.getElementById("app");
  let items = "";
  data.reading_order.forEach(item => {
    items += `
      <li>
        <strong>${item.order}. ${item.file}</strong>
        <details>
          <summary>Why it matters</summary>
          <p>${item.why_it_matters}</p>
        </details>
      </li>
    `;
  });

  app.innerHTML += `
    <div class="card">
      <h2>Reading Order</h2>
      <ol>${items}</ol>
    </div>
  `;
  }

  function renderSetup(data) {
  const app = document.getElementById("app");
  let items = "";
  data.setup_instructions.forEach(step => {
    items += `<li>${step}</li>`;
  });

  app.innerHTML += `
    <div class="card">
      <h2>Setup Instructions</h2>
      <ul>${items}</ul>
    </div>
  `;
}
 

</script>
</body>
</html>
